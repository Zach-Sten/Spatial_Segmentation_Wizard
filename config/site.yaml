# ============================================================================
# site.yaml — Cluster-specific settings
# ============================================================================
#
# Everything in this file describes THE MACHINE, not the analysis. It is the
# only file another site needs to edit to run this pipeline on their own HPC.
#
# The analysis config (pipeline_config.yaml) is regenerated by the wizard on
# every run and holds per-experiment choices: data paths, methods, memory.
# This file is stable per-cluster and is edited by hand, once.
#
# Every key below has a default baked into scripts/utils/config_loader.py, so
# a missing key or a missing file is fine — you only override what differs.
#
# Point at a different file with:  export SEGWIZ_SITE_CONFIG=/path/to/site.yaml
#
# ── Porting checklist for a new cluster ──
#   1. container_cmd  — is it `singularity` or `apptainer`?
#   2. preamble       — does the container runtime need `module load` first?
#   3. gpu_gres       — what does `sinfo -o %G` report for your GPU nodes?
#   4. gpu_partition  — what does `sinfo -s` call the GPU partition?
#   5. python_bin     — leave as `python` unless you built your own container.
# ============================================================================

# ── Container runtime ──
# Binary used to execute the .sif. Many sites ship only `apptainer` now;
# it is CLI-compatible with singularity for the flags used here.
container_cmd: "singularity"

# Shell lines emitted verbatim near the top of every generated SLURM script,
# before the container is invoked. Use for `module load`, cache dirs, proxies.
# Example for a module-based site:
#   preamble:
#     - "module load apptainer"
#     - "export APPTAINER_CACHEDIR=/scratch/$USER/.apptainer"
preamble: []

# Python interpreter INSIDE the container, as an absolute path.
#
# Do not shorten this to bare `python`. The shipped container activates its
# conda env, but then prepends /opt/miniforge3/bin (base conda) to PATH, so
# `python` resolves to the BASE interpreter — which has none of the
# segmentation packages. Jobs fail on import, minutes in.
#
# If you build your own container, point this at your env's interpreter and
# verify with:  singularity exec your.sif <path> -c "import sopa"
python_bin: "/opt/miniforge3/envs/spatial_segmentation_env/bin/python"

# ── GPU ──
# Value passed to `#SBATCH --gres=`. This is highly site-specific: MIG slices
# ("gpu:1g.10gb:1"), typed GPUs ("gpu:a100:1"), or plain counts ("gpu:1").
# Check with: sinfo -o "%P %G"
gpu_gres: "gpu:1g.10gb:1"

# Partition and account used when a method requests gpu: true and the analysis
# config does not name one explicitly. Empty string = omit the directive.
gpu_partition: "common"
gpu_account: "common"

# ── Filesystem ──
# Extra paths bind-mounted into every container invocation, on top of the data,
# output, log, and pipeline paths the generator works out for itself. Add
# scratch or reference filesystems your jobs must reach.
#   extra_binds:
#     - "/scratch"
extra_binds: []

# Open-file limit raised before launching the container — segmentation methods
# open many patch files at once. Lower it if your site's hard limit is below
# this, otherwise the `ulimit` call fails and takes the job with it.
# Check with: ulimit -Hn
ulimit_nofile: 65536
